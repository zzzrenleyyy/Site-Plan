<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Plan Generator</title>
<style>
:root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *:before, *:after { box-sizing: border-box; font-family: Segoe UI, Roboto, sans-serif; }
body { margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
.app-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; }
.sidebar { width: 390px; max-width: 100%; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-height: 90vh; overflow-y: auto; }
.canvas-section { flex: 1; min-width: 300px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; overflow-x: auto; }
h2 { margin-top: 0; font-size: 1.2rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
.section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #1d4ed8; margin: 15px 0 8px; font-weight: bold; }
.input-group { display: flex; gap: 10px; margin-bottom: 10px; }
.input-field { flex: 1; }
label { display: block; font-size: 0.75rem; color: #475569; margin-bottom: 4px; font-weight: 600; }
input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; }
input[readonly] { background: #f1f5f9; color: #64748b; }
.btn-group { display: flex; gap: 6px; margin-bottom: 12px; }
.btn-edge { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
.btn-edge.active { background: #0f172a; color: white; border-color: #0f172a; }
canvas { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; max-width: 100%; height: auto; }
.summary-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 4px; margin-top: 15px; font-size: 0.85rem; line-height: 1.5; }
.btn-save { width: 100%; padding: 12px; margin-top: 15px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
.btn-save:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div class="app-container">
<div class="sidebar">
<h2>Site Plan Inputs</h2>
<div class="section-title">Property Details</div>
<div class="input-field" style="margin-bottom: 10px;">
<label>Property Name / Address</label>
<input type="text" id="propName" value="18350 14th Ave, Orlando FL" oninput="saveAndDraw()">
</div>
<div class="section-title">Front Edge (Street Direction)</div>
<div class="btn-group">
<button class="btn-edge" id="edgeTop" onclick="setFrontEdge('Top')">Top</button>
<button class="btn-edge active" id="edgeBottom" onclick="setFrontEdge('Bottom')">Bottom</button>
<button class="btn-edge" id="edgeLeft" onclick="setFrontEdge('Left')">Left</button>
<button class="btn-edge" id="edgeRight" onclick="setFrontEdge('Right')">Right</button>
</div>
<div class="input-group">
<div class="input-field"><label>Lot Width (ft)</label><input type="number" id="propW" value="165" oninput="saveAndDraw()"></div>
<div class="input-field"><label>Lot Depth (ft)</label><input type="number" id="propD" value="300" oninput="saveAndDraw()"></div>
</div>
<div class="section-title">Setbacks</div>
<div class="input-group">
<div class="input-field"><label>FRONT SETBACK (ft)</label><input type="number" id="sbFront" value="25" oninput="saveAndDraw()"></div>
<div class="input-field"><label>REAR SETBACK (ft)</label><input type="number" id="sbRear" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group">
<div class="input-field"><label id="lblLeftSetback">LEFT SIDE SETBACK (ft)</label><input type="number" id="sbLeft" value="15" oninput="saveAndDraw()"></div>
<div class="input-field"><label id="lblRightSetback">RIGHT SIDE SETBACK (ft)</label><input type="number" id="sbRight" value="15" oninput="saveAndDraw()"></div>
</div>
<div class="section-title">House Footprint &amp; Position</div>
<div class="input-group">
<div class="input-field"><label>House Width (ft)</label><input type="number" id="houseW" value="50" oninput="saveAndDraw()"></div>
<div class="input-field"><label>House Depth (ft)</label><input type="number" id="houseD" value="40" oninput="saveAndDraw()"></div>
</div>
<div class="input-group">
<div class="input-field"><label>Dist: House to Front (ft)</label><input type="number" id="distHouseFront" value="80" oninput="saveAndDraw()"></div>
</div>
<div class="input-group">
<div class="input-field"><label>House Position</label>
<select id="houseAlign" onchange="toggleAlign()"><option value="Center">Center</option><option value="Left">Left</option><option value="Right">Right</option></select></div>
<div class="input-field" id="houseSideWrap" style="display:none"><label id="houseSideLabel">Dist: Left Property Line to House (ft)</label><input type="number" id="houseSideDist" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="section-title">Porch</div>
<div class="input-group">
<div class="input-field"><label>Porch Position</label>
<select id="porchPos" onchange="toggleAlign()"><option value="None">None</option><option value="Front">Front</option><option value="Back">Back</option><option value="Left">Side Left</option><option value="Right">Side Right</option></select></div>
</div>
<div class="input-group" id="porchSizeGroup" style="display:none">
<div class="input-field"><label>Porch Width (ft)</label><input type="number" id="porchW" value="20" oninput="saveAndDraw()"></div>
<div class="input-field"><label>Porch Depth (ft)</label><input type="number" id="porchD" value="8" oninput="saveAndDraw()"></div>
</div>

<div class="section-title">Stairs Configuration</div>
<div class="input-group">
<div class="input-field">
<label>Stairs Type</label>
<select id="stairsType" onchange="updateStairsQtyUI()"><option value="None">None</option><option value="Single" selected>Single Stairs</option></select>
</div>
<div class="input-field" id="stairsQtyWrap">
<label>Quantity (1 - 3)</label>
<select id="stairsQty" onchange="updateStairsQtyUI()"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select>
</div>
</div>
<div id="stairsPosContainer"></div>

<div class="section-title">Single Door Configuration</div>
<div class="input-group">
<div class="input-field">
<label>Single Door Quantity</label>
<select id="singleDoorQty" onchange="updateDoorQtyUI('single')"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select>
</div>
</div>
<div id="singleDoorPosContainer"></div>

<div class="section-title">Sliding Door Configuration</div>
<div class="input-group">
<div class="input-field">
<label>Sliding Door Quantity</label>
<select id="slidingDoorQty" onchange="updateDoorQtyUI('sliding')"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
</div>
</div>
<div id="slidingDoorPosContainer"></div>

<div class="section-title">Driveway</div>
<div class="input-group">
<div class="input-field"><label>Driveway Position</label>
<select id="drivePos" onchange="toggleAlign()"><option value="None">None</option><option value="Left">Side Left</option><option value="Right">Side Right</option><option value="Front">Front Center</option></select></div>
<div class="input-field" id="driveWrap" style="display:none"><label>Driveway Width (ft)</label><input type="number" id="driveW" value="12" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="drivePLWrap" style="display:none">
<div class="input-field"><label id="drivePLLabel">Dist: Property Line to Driveway (ft) - blank = auto</label><input type="number" id="drivePLDist" value="" placeholder="Auto (next to house)" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="driveDepthWrap" style="display:none">
<div class="input-field"><label>Driveway Depth (ft) - leave blank for auto</label><input type="number" id="driveD" value="" placeholder="Auto (to the house)" oninput="saveAndDraw()"></div>
</div>

<div class="section-title">Septic System</div>
<div class="input-group">
<div class="input-field"><label>Septic Location (relative to house)</label>
<select id="septicLoc" onchange="toggleAlign()"><option value="None">None</option><option value="Back" selected>Back</option><option value="Front">Front</option><option value="Left">Side Left</option><option value="Right">Side Right</option></select></div>
</div>
<div id="septicDetails">
<div class="input-group">
<div class="input-field"><label>Septic Width (ft)</label><input type="number" id="septicW" value="40" oninput="saveAndDraw()"></div>
<div class="input-field"><label>Septic Depth (ft)</label><input type="number" id="septicD" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group">
<div class="input-field"><label>Dist: House to Septic (ft)</label><input type="number" id="distHouseSeptic" value="20" oninput="septicLastEdited='houseSeptic'; saveAndDraw()"></div>
<div class="input-field"><label>Dist: Septic to Rear Property Line (ft)</label><input type="number" id="distSepticRear" value="140" oninput="septicLastEdited='septicRear'; saveAndDraw()"></div>
</div>
<div class="input-group" id="septicAlignGroup">
<div class="input-field"><label>Septic Sideways Position</label>
<select id="septicAlign" onchange="toggleAlign()"><option value="Center">Center</option><option value="Left">Left</option><option value="Right">Right</option></select></div>
<div class="input-field" id="septicSideWrap" style="display:none"><label id="septicSideLabel">Dist: Left Property Line to Septic (ft)</label><input type="number" id="septicSideDist" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="septicPLWrap" style="display:none">
<div class="input-field"><label id="septicPLLabel">Dist: Property Line to Septic (ft) - blank = auto</label><input type="number" id="septicPLDist" value="" placeholder="Auto (next to house)" oninput="saveAndDraw()"></div>
</div>
</div>

<div class="section-title">Well System</div>
<div class="input-group">
<div class="input-field"><label>Well Location (relative to house)</label>
<select id="wellLoc" onchange="toggleAlign()"><option value="None">None</option><option value="Back">Back</option><option value="Front" selected>Front</option><option value="Left">Side Left</option><option value="Right">Side Right</option></select></div>
</div>
<div id="wellDetails">
<div class="input-group">
<div class="input-field"><label>Well Diameter (ft)</label><input type="number" id="wellDiam" value="6" oninput="saveAndDraw()"></div>
</div>
<div class="input-group">
<div class="input-field"><label>Dist: House to Well (ft)</label><input type="number" id="distHouseWell" value="20" oninput="wellLastEdited='houseWell'; saveAndDraw()"></div>
<div class="input-field"><label>Dist: Well to Rear Property Line (ft)</label><input type="number" id="distWellRear" value="140" oninput="wellLastEdited='wellRear'; saveAndDraw()"></div>
</div>
<div class="input-group" id="wellAlignGroup">
<div class="input-field"><label>Well Sideways Position</label>
<select id="wellAlign" onchange="toggleAlign()"><option value="Center">Center</option><option value="Left" selected>Left</option><option value="Right">Right</option></select></div>
<div class="input-field" id="wellSideWrap" style="display:none"><label id="wellSideLabel">Dist: Left Property Line to Well (ft)</label><input type="number" id="wellSideDist" value="30" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="wellPLWrap" style="display:none">
<div class="input-field"><label id="wellPLLabel">Dist: Property Line to Well (ft) - blank = auto</label><input type="number" id="wellPLDist" value="" placeholder="Auto (next to house)" oninput="saveAndDraw()"></div>
</div>
</div>

<div class="section-title">Water Meter (Existing)</div>
<div class="input-group">
<div class="input-field"><label>Water Meter Location (relative to house)</label>
<select id="meterLoc" onchange="toggleAlign()"><option value="None" selected>None</option><option value="Back">Back</option><option value="Front">Front</option><option value="Left">Side Left</option><option value="Right">Side Right</option></select></div>
</div>
<div id="meterDetails" style="display:none">
<div class="input-group">
<div class="input-field"><label>Water Meter Size (ft)</label><input type="number" id="meterSize" value="3" oninput="saveAndDraw()"></div>
<div class="input-field"><label>Dist: House to Water Meter (ft)</label><input type="number" id="distHouseMeter" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="meterAlignGroup">
<div class="input-field"><label>Water Meter Sideways Position</label>
<select id="meterAlign" onchange="toggleAlign()"><option value="Center">Center</option><option value="Left">Left</option><option value="Right">Right</option></select></div>
<div class="input-field" id="meterSideWrap" style="display:none"><label id="meterSideLabel">Dist: Left Property Line to Water Meter (ft)</label><input type="number" id="meterSideDist" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="meterPLWrap" style="display:none">
<div class="input-field"><label id="meterPLLabel">Dist: Property Line to Water Meter (ft) - blank = auto</label><input type="number" id="meterPLDist" value="" placeholder="Auto (next to house)" oninput="saveAndDraw()"></div>
</div>
</div>

<div class="section-title">City Sewer (Existing)</div>
<div class="input-group">
<div class="input-field"><label>City Sewer Location (relative to house)</label>
<select id="sewerLoc" onchange="toggleAlign()"><option value="None" selected>None</option><option value="Back">Back</option><option value="Front">Front</option><option value="Left">Side Left</option><option value="Right">Side Right</option></select></div>
</div>
<div id="sewerDetails" style="display:none">
<div class="input-group">
<div class="input-field"><label>City Sewer Size (ft)</label><input type="number" id="sewerSize" value="3" oninput="saveAndDraw()"></div>
<div class="input-field"><label>Dist: House to City Sewer (ft)</label><input type="number" id="distHouseSewer" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="sewerAlignGroup">
<div class="input-field"><label>City Sewer Sideways Position</label>
<select id="sewerAlign" onchange="toggleAlign()"><option value="Center">Center</option><option value="Left">Left</option><option value="Right">Right</option></select></div>
<div class="input-field" id="sewerSideWrap" style="display:none"><label id="sewerSideLabel">Dist: Left Property Line to City Sewer (ft)</label><input type="number" id="sewerSideDist" value="20" oninput="saveAndDraw()"></div>
</div>
<div class="input-group" id="sewerPLWrap" style="display:none">
<div class="input-field"><label id="sewerPLLabel">Dist: Property Line to City Sewer (ft) - blank = auto</label><input type="number" id="sewerPLDist" value="" placeholder="Auto (next to house)" oninput="saveAndDraw()"></div>
</div>
</div>

<div class="summary-box" id="metrics"></div>
<button class="btn-save" onclick="saveContractorSheet()">Save Professional Contractor Sheet (PNG)</button>
</div>
<div class="canvas-section">
<canvas id="planCanvas" width="950" height="1020"></canvas>
</div>
</div>
<script>
let frontEdge = 'Bottom';
let septicLastEdited = 'houseSeptic';
let wellLastEdited = 'houseWell';
let pending = {}; // saved values waiting for dynamically-built fields (stairs / doors)

/* ---------- saved state (private to this browser) ---------- */
function saveState() {
  try {
    const data = { frontEdge };
    document.querySelectorAll('input, select').forEach(el => { if (el.id) data[el.id] = el.value; });
    localStorage.setItem('sitePlanState', JSON.stringify(data));
  } catch (e) { /* storage unavailable: ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem('sitePlanState');
    if (!raw) return false;
    const data = JSON.parse(raw);
    pending = data;
    if (data.frontEdge) setFrontEdge(data.frontEdge, true);
    Object.entries(data).forEach(([id, v]) => {
      if (id === 'frontEdge') return;
      const el = document.getElementById(id);
      if (el) el.value = v;
    });
    return true;
  } catch (e) { return false; }
}

function saveAndDraw() {
  saveState();
  drawSitePlan();
}

function edgeNames() {
  const v = (frontEdge === 'Left' || frontEdge === 'Right');
  return [v ? 'Top' : 'Left', v ? 'Bottom' : 'Right'];
}

// Every spot on a house wall (used by both stairs and doors)
const WALL_POS = ['Front (Left Side)', 'Front (Center)', 'Front (Right Side)', 'Back (Left Side)', 'Back (Center)', 'Back (Right Side)',
  'Side Left (Top)', 'Side Left (Center)', 'Side Left (Bottom)', 'Side Right (Top)', 'Side Right (Center)', 'Side Right (Bottom)'];

function normPos(p) { // older saved values
  if (p === 'Front' || p === 'Back') return p + ' (Center)';
  if (p === 'Left' || p === 'Sides Left') return 'Side Left (Center)';
  if (p === 'Right' || p === 'Sides Right') return 'Side Right (Center)';
  return p;
}

function wallOptText(v) {
  const vert = (frontEdge === 'Left' || frontEdge === 'Right');
  const [a, b] = edgeNames();
  const p1 = vert ? 'Left' : 'Top', p2 = vert ? 'Right' : 'Bottom';
  const m = v.match(/^Side (Left|Right) \((Top|Center|Bottom)\)$/);
  if (m) return `Side ${m[1] === 'Left' ? a : b} (${m[2] === 'Top' ? p1 : (m[2] === 'Bottom' ? p2 : 'Center')})`;
  const f = v.match(/^(Front|Back) \((Left Side|Center|Right Side)\)$/);
  if (f) return `${f[1]} (${f[2] === 'Left Side' ? a + ' Side' : (f[2] === 'Right Side' ? b + ' Side' : 'Center')})`;
  return v;
}

function wallOptionsHtml() {
  return WALL_POS.map(v => `<option value="${v}">${wallOptText(v)}</option>`).join('');
}

function setFrontEdge(edge, skipDraw) {
  frontEdge = edge;
  document.querySelectorAll('.btn-edge').forEach(btn => btn.classList.remove('active'));
  const btn = document.getElementById('edge' + edge);
  if (btn) btn.classList.add('active');
  const vert = (edge === 'Left' || edge === 'Right');
  document.getElementById('lblLeftSetback').innerText = vert ? 'SIDE SETBACK (ft)' : 'LEFT SIDE SETBACK (ft)';
  document.getElementById('lblRightSetback').innerText = vert ? 'SIDE SETBACK (ft)' : 'RIGHT SIDE SETBACK (ft)';
  updateAlignLabels();
  if (!skipDraw) saveAndDraw();
}

/* ---------- stairs & doors (dynamic fields) ---------- */
function updateStairsQtyUI(skipDraw) {
  const [a, b] = edgeNames();
  const stairsNone = document.getElementById('stairsType').value === 'None';
  document.getElementById('stairsQtyWrap').style.display = stairsNone ? 'none' : '';
  const qty = stairsNone ? 0 : (parseInt(document.getElementById('stairsQty').value) || 1);
  const old = {};
  for (let i = 1; i <= 3; i++) { const el = document.getElementById('stairsPos' + i); if (el) old[i] = el.value; }
  let html = '';
  for (let i = 1; i <= qty; i++) {
    html += `<div class="input-group"><div class="input-field"><label>Stair #${i} Position</label>
      <select id="stairsPos${i}" onchange="saveAndDraw()">
        ${wallOptionsHtml()}
      </select></div></div>`;
  }
  document.getElementById('stairsPosContainer').innerHTML = html;
  for (let i = 1; i <= qty; i++) {
    const el = document.getElementById('stairsPos' + i);
    el.value = normPos(old[i] || pending['stairsPos' + i] || ['Front (Center)', 'Back (Center)', 'Side Left (Center)'][i - 1]);
    if (!el.value) el.value = 'Front (Center)';
  }
  if (!skipDraw) saveAndDraw();
}

function updateDoorQtyUI(type, skipDraw) {
  const [a, b] = edgeNames();
  const [p1, p2] = (frontEdge === 'Left' || frontEdge === 'Right') ? ['Left', 'Right'] : ['Top', 'Bottom'];
  const qty = parseInt(document.getElementById(type + 'DoorQty').value) || 0;
  const old = {};
  const oldK = {};
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(type + 'DoorPos' + i); if (el) old[i] = el.value;
    const ek = document.getElementById(type + 'DoorKind' + i); if (ek) oldK[i] = ek.value;
  }
  let html = '';
  for (let i = 1; i <= qty; i++) {
    const dn = type === 'single' ? 'Single' : 'Sliding';
    html += `<div class="input-group"><div class="input-field"><label>${dn} Door #${i} - Front or Back Door</label>
      <select id="${type}DoorKind${i}" onchange="saveAndDraw()"><option value="Front">Front Door</option><option value="Back">Back Door</option></select></div></div>
      <div class="input-group"><div class="input-field"><label>${dn} Door #${i} Position</label>
      <select id="${type}DoorPos${i}" onchange="saveAndDraw()">
        ${wallOptionsHtml()}
      </select></div></div>`;
  }
  document.getElementById(type + 'DoorPosContainer').innerHTML = html;
  for (let i = 1; i <= qty; i++) {
    const el = document.getElementById(type + 'DoorPos' + i);
    el.value = normPos(old[i] || pending[type + 'DoorPos' + i] || 'Front (Left Side)');
    if (!el.value) el.value = 'Front (Left Side)'; // older saved values that no longer exist
    const ek = document.getElementById(type + 'DoorKind' + i);
    ek.value = oldK[i] || pending[type + 'DoorKind' + i] || (type === 'single' ? 'Front' : 'Back');
    if (!ek.value) ek.value = type === 'single' ? 'Front' : 'Back';
  }
  if (!skipDraw) saveAndDraw();
}

/* ---------- show/hide + Left/Right <-> Top/Bottom wording ---------- */
function updateAlignLabels() {
  const g = id => document.getElementById(id);
  const [a, b] = edgeNames();
  ['septicLoc', 'wellLoc', 'meterLoc', 'sewerLoc', 'porchPos', 'drivePos'].forEach(id => {
    Array.from(g(id).options).forEach(o => {
      if (o.value === 'Left') o.text = 'Side ' + a;
      if (o.value === 'Right') o.text = 'Side ' + b;
    });
  });
  const names = { house: 'House', septic: 'Septic', well: 'Well', meter: 'Water Meter', sewer: 'City Sewer' };
  ['house', 'septic', 'well', 'meter', 'sewer'].forEach(k => {
    const sel = g(k + 'Align');
    sel.options[1].text = a;
    sel.options[2].text = b;
    g(k + 'SideWrap').style.display = (sel.value === 'Center') ? 'none' : '';
    g(k + 'SideLabel').innerText = `Dist: ${sel.value === 'Left' ? a : b} Property Line to ${names[k]} (ft)`;
  });
  // Re-word the stairs / door lists
  document.querySelectorAll('select[id^="stairsPos"] option, select[id*="DoorPos"] option').forEach(o => { o.text = wallOptText(o.value); });
  ['septic', 'well', 'meter', 'sewer'].forEach(k => {
    const loc = g(k + 'Loc').value;
    g(k + 'AlignGroup').style.display = (loc === 'Front' || loc === 'Back') ? '' : 'none';
    g(k + 'Details').style.display = (loc === 'None') ? 'none' : '';
  });
  const sBack = g('septicLoc').value === 'Back';
  g('distSepticRear').readOnly = !sBack;
  if (!sBack) septicLastEdited = 'houseSeptic';
  const wBack = g('wellLoc').value === 'Back';
  g('distWellRear').readOnly = !wBack;
  if (!wBack) wellLastEdited = 'houseWell';
  g('porchSizeGroup').style.display = (g('porchPos').value === 'None') ? 'none' : '';
  g('driveWrap').style.display = (g('drivePos').value === 'None') ? 'none' : '';
  g('driveDepthWrap').style.display = (g('drivePos').value === 'None') ? 'none' : '';
  [['septic', 'Septic'], ['well', 'Well'], ['meter', 'Water Meter'], ['sewer', 'City Sewer']].forEach(([k, n]) => {
    const loc = g(k + 'Loc').value;
    g(k + 'PLWrap').style.display = (loc === 'Left' || loc === 'Right') ? '' : 'none';
    g(k + 'PLLabel').innerText = `Dist: ${loc === 'Left' ? a : b} Property Line to ${n} (ft) - blank = auto`;
  });
  const dpv = g('drivePos').value;
  g('drivePLWrap').style.display = (dpv === 'Left' || dpv === 'Right') ? '' : 'none';
  g('drivePLLabel').innerText = `Dist: ${dpv === 'Left' ? a : b} Property Line to Driveway (ft) - blank = auto`;
}

function toggleAlign() {
  updateAlignLabels();
  saveAndDraw();
}

function midOverlap(a0, a1, b0, b1) {
  const lo = Math.max(a0, b0), hi = Math.min(a1, b1);
  return hi > lo ? (lo + hi) / 2 : (b0 + b1) / 2;
}

/* ---------- drawing helpers ---------- */
function drawRoad(ctx, x, y, w, h, label) {
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#475569';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 4);
}

function drawVerticalRoad(ctx, x, y, w, h, label) {
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#475569';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, 0, 4);
  ctx.restore();
}

let LBOX = [];   // text already on the plan: names, sizes and dimension labels
let SBOX = [];   // object shapes (dimension labels prefer not to sit on them)
let LBOUNDS = { w: 950, h: 1020 };

function overlapArea(a, b) {
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  return (w > 0 && h > 0) ? w * h : 0;
}
function boxScore(r) { // 0 = completely clear
  if (r.x < 2 || r.y < 2 || r.x + r.w > LBOUNDS.w - 2 || r.y + r.h > LBOUNDS.h - 2) return 1e6;
  let sc = 0;
  LBOX.forEach(o => { sc += overlapArea(r, o) * 4; });
  SBOX.forEach(o => { sc += overlapArea(r, o); });
  return sc;
}

function computeLabelBox(ctx, x1, y1, x2, y2, label, opts) {
  ctx.save();
  ctx.font = opts.font || '10px sans-serif';
  let dx = opts.dx || 0, dy = opts.dy || 0, anchor = opts.anchor;
  if (opts.side) {
    if (Math.abs(x1 - x2) < 1) { dx = opts.side * 8; anchor = opts.side > 0 ? 'right-of' : 'left-of'; }
    else dy = opts.side * 11;
  }
  const bw = ctx.measureText(label).width + 10;
  let cx = (x1 + x2) / 2 + dx;
  if (anchor === 'right-of') cx += bw / 2;
  if (anchor === 'left-of') cx -= bw / 2;
  const cy = (y1 + y2) / 2 + dy;
  ctx.restore();
  return { cx, cy, bw };
}

// opts: color, dash, font, dx, dy, anchor ('right-of'|'left-of'), side (+1 / -1), fixed (never move the label)
function drawDimensionArrow(ctx, x1, y1, x2, y2, label, opts = {}) {
  const color = opts.color || '#475569';
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1;
  if (opts.dash) ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);
  if (Math.hypot(x2 - x1, y2 - y1) > 8) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    [[x1, y1, ang + Math.PI], [x2, y2, ang]].forEach(([px, py, a]) => {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + 7 * Math.cos(a - 0.4), py + 7 * Math.sin(a - 0.4));
      ctx.lineTo(px + 7 * Math.cos(a + 0.4), py + 7 * Math.sin(a + 0.4));
      ctx.closePath();
      ctx.fill();
    });
  }
  if (label) {
    ctx.font = opts.font || '10px sans-serif';
    const base = computeLabelBox(ctx, x1, y1, x2, y2, label, opts);
    const bw = base.bw;
    let best = { cx: base.cx, cy: base.cy };
    if (!opts.fixed) {
      // try the requested spot first, then slide along the line, then the other side of it, then on the line
      const vert = Math.abs(x1 - x2) < 1, horiz = Math.abs(y1 - y2) < 1;
      const ts = [0.5, 0.3, 0.7, 0.15, 0.85, 0.05, 0.95];
      const pt = t => ({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t });
      const ox = base.cx - (x1 + x2) / 2, oy = base.cy - (y1 + y2) / 2;
      const cands = [{ cx: base.cx, cy: base.cy }];
      ts.forEach(t => { const p = pt(t); cands.push({ cx: p.x + ox, cy: p.y + oy }); });
      if (vert) [1, -1].forEach(sd => ts.forEach(t => { const p = pt(t); cands.push({ cx: p.x + sd * (bw / 2 + 6), cy: p.y }); }));
      else if (horiz) [1, -1].forEach(sd => [11, 25].forEach(ex => ts.forEach(t => { const p = pt(t); cands.push({ cx: p.x, cy: p.y + sd * ex }); })));
      ts.forEach(t => { const p = pt(t); cands.push({ cx: p.x, cy: p.y }); });
      let bestSc = Infinity;
      for (const c of cands) {
        const sc = boxScore({ x: c.cx - bw / 2, y: c.cy - 7, w: bw, h: 14 });
        if (sc < bestSc) { bestSc = sc; best = c; if (sc === 0) break; }
      }
    }
    LBOX.push({ x: best.cx - bw / 2, y: best.cy - 7, w: bw, h: 14 });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(best.cx - bw / 2, best.cy - 7, bw, 14);
    ctx.fillStyle = opts.textColor || '#0f172a';
    ctx.textAlign = 'center';
    ctx.fillText(label, best.cx, best.cy + 3);
  }
  ctx.restore();
}

// Horizontal dimension placed below the shapes, with dotted extension lines (for gaps too small for the label)
function drawDimWithExt(ctx, xa, ya, xb, yb, dimY, label, lo, hi) {
  ctx.save();
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(xa, ya); ctx.lineTo(xa, dimY);
  ctx.moveTo(xb, yb); ctx.lineTo(xb, dimY);
  ctx.stroke();
  ctx.restore();
  let shift = 0;
  if (lo !== undefined && hi !== undefined) {
    ctx.font = '10px sans-serif';
    const half = ctx.measureText(label).width / 2 + 5;
    const mid = (xa + xb) / 2;
    shift = Math.min(Math.max(mid, lo + half), hi - half) - mid;
  }
  drawDimensionArrow(ctx, xa, dimY, xb, dimY, label, { dx: shift });
}

/* ---------- main drawing ---------- */
function drawSitePlan(targetCanvas, pixelRatio, exportMode) {
  const canvas = (targetCanvas && targetCanvas.getContext) ? targetCanvas : document.getElementById('planCanvas');
  const ctx = canvas.getContext('2d');
  const ratio = pixelRatio || 1;
  const CW = 950, CH = exportMode ? canvas.height / ratio : 1020;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  LBOX = []; SBOX = []; LBOUNDS = { w: 950, h: exportMode ? canvas.height / (pixelRatio || 1) : 1020 };
  const num = id => parseFloat(document.getElementById(id).value) || 0;
  const val = id => document.getElementById(id).value;
  const r2 = v => Math.round(v * 100) / 100;

  const title = val('propName') || 'SITE PLAN';
  const pW = num('propW'), pD = num('propD');
  const rawSbF = num('sbFront'), rawSbR = num('sbRear'), rawSbL = num('sbLeft'), rawSbRight = num('sbRight');
  const rawHW = num('houseW'), rawHD = num('houseD'), dHouseFront = num('distHouseFront');
  const rawSW = num('septicW'), rawSD = num('septicD');
  const wellDiam = num('wellDiam');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CW, CH);
  if (pW <= 0 || pD <= 0) return null;

  const isVert = (frontEdge === 'Left' || frontEdge === 'Right');
  const padX = isVert ? 170 : 140;
  const availW = CW - padX * 2;
  const topExtra = (!exportMode && frontEdge === 'Top') ? 45 : 0; // keeps the Top road box below the property name
  const availH = exportMode ? 540 : (CH - 95 - 280 - topExtra);
  const scale = Math.min(availW / pW, availH / pD);
  const originX = (CW - pW * scale) / 2;
  const originY = exportMode ? (frontEdge === 'Top' ? 205 : 140) : 95 + topExtra + (availH - pD * scale) / 2;

  const L = isVert ? pD : pW;   // lot length along the street
  const V = isVert ? pW : pD;   // lot depth away from the street
  const houseAlign = val('houseAlign'), septicAlign = val('septicAlign'), wellAlign = val('wellAlign');
  const houseSide = num('houseSideDist'), septicSide = num('septicSideDist'), wellSide = num('wellSideDist');
  const septicLoc = val('septicLoc'), wellLoc = val('wellLoc'), porchPos = val('porchPos'), drivePos = val('drivePos');
  const porchW = num('porchW'), porchD = num('porchD'), driveW = num('driveW');
  const sideName = k => k === 'Left' ? (isVert ? 'Top' : 'Left') : (isVert ? 'Bottom' : 'Right');
  const posTxt = (a, d) => a === 'Center' ? 'Center' : `${sideName(a)}, ${d}' from property line`;
  const locTxt = k => (k === 'Back' || k === 'Front') ? k : `Side ${sideName(k)}`;
  const latOff = (align, dist, size) => align === 'Left' ? dist : (align === 'Right' ? L - dist - size : (L - size) / 2);

  // Setbacks on canvas sides (for the red buildable rectangle)
  let sbTop, sbBottom, sbLeft, sbRightEdge;
  if (frontEdge === 'Bottom') { sbBottom = rawSbF; sbTop = rawSbR; sbLeft = rawSbL; sbRightEdge = rawSbRight; }
  else if (frontEdge === 'Top') { sbTop = rawSbF; sbBottom = rawSbR; sbLeft = rawSbL; sbRightEdge = rawSbRight; }
  else if (frontEdge === 'Left') { sbLeft = rawSbF; sbRightEdge = rawSbR; sbTop = rawSbL; sbBottom = rawSbRight; }
  else { sbRightEdge = rawSbF; sbLeft = rawSbR; sbTop = rawSbL; sbBottom = rawSbRight; }
  const buildW = Math.max(0, pW - sbLeft - sbRightEdge);
  const buildD = Math.max(0, pD - sbTop - sbBottom);

  /* ----- layout in street coordinates: u = along the street, v = distance from the street (feet) ----- */
  const house = { u0: latOff(houseAlign, houseSide, rawHW), v0: dHouseFront, w: rawHW, h: rawHD };
  let porch = null;
  if (porchPos !== 'None' && porchW > 0 && porchD > 0) {
    if (porchPos === 'Front') porch = { u0: house.u0 + (house.w - porchW) / 2, v0: house.v0 - porchD, w: porchW, h: porchD };
    else if (porchPos === 'Back') porch = { u0: house.u0 + (house.w - porchW) / 2, v0: house.v0 + house.h, w: porchW, h: porchD };
    else if (porchPos === 'Left') porch = { u0: house.u0 - porchD, v0: house.v0 + (house.h - porchW) / 2, w: porchD, h: porchW };
    else porch = { u0: house.u0 + house.w, v0: house.v0 + (house.h - porchW) / 2, w: porchD, h: porchW };
  }
  const ext = { // house + porch outline: septic / well distances are measured from it
    u0: house.u0 - (porch && porchPos === 'Left' ? porchD : 0),
    u1: house.u0 + house.w + (porch && porchPos === 'Right' ? porchD : 0),
    v0: house.v0 - (porch && porchPos === 'Front' ? porchD : 0),
    v1: house.v0 + house.h + (porch && porchPos === 'Back' ? porchD : 0)
  };

  // Side locations can be placed by their distance from the property line (blank = next to the house)
  const plIn = k => { const e = document.getElementById(k + 'PLDist'); return (e && e.value !== '') ? (parseFloat(e.value) || 0) : null; };
  const applyPL = (o, loc, k) => {
    const pl = plIn(k);
    if (!o || pl === null || (loc !== 'Left' && loc !== 'Right')) return null;
    o.u0 = loc === 'Left' ? pl : L - pl - o.w;
    return r2(loc === 'Left' ? ext.u0 - (o.u0 + o.w) : o.u0 - ext.u1); // resulting gap to the house
  };

  // Stairs (4' x 3', outside the wall) and doors (4' wide, in the wall): any spot on any house wall
  const hiV = (frontEdge === 'Bottom' || frontEdge === 'Right') ? 0.75 : 0.25; // where "Top" / "Left" sits along a side wall
  const wallRect = (pos0, along, thick, outside) => {
    const pos = normPos(pos0);
    const wall = pos.startsWith('Front') ? 'Front' : pos.startsWith('Back') ? 'Back' : (pos.startsWith('Side Left') ? 'Left' : 'Right');
    if (wall === 'Front' || wall === 'Back') {
      const f = pos.includes('Left Side') ? 0.25 : (pos.includes('Right Side') ? 0.75 : 0.5);
      const wallV = wall === 'Front' ? house.v0 : house.v0 + house.h;
      const v0 = outside ? (wall === 'Front' ? wallV - thick : wallV) : wallV - thick / 2;
      return { u0: house.u0 + house.w * f - along / 2, v0, w: along, h: thick };
    }
    const f = pos.includes('(Center)') ? 0.5 : (pos.includes('(Top)') ? hiV : 1 - hiV);
    const wallU = wall === 'Left' ? house.u0 : house.u0 + house.w;
    const u0 = outside ? (wall === 'Left' ? wallU - thick : wallU) : wallU - thick / 2;
    return { u0, v0: house.v0 + house.h * f - along / 2, w: thick, h: along };
  };
  const stairsQty = val('stairsType') === 'None' ? 0 : (parseInt(val('stairsQty')) || 1);
  const stairsList = [];
  for (let i = 1; i <= stairsQty; i++) {
    const el = document.getElementById('stairsPos' + i);
    const pos = normPos(el ? el.value : 'Front (Center)');
    stairsList.push(Object.assign(wallRect(pos, 4, 3, true), { pos, index: i }));
  }
  const doorsList = [];
  [['single', 'Single Door'], ['sliding', 'Sliding Door']].forEach(([type, name]) => {
    const qty = parseInt(val(type + 'DoorQty')) || 0;
    for (let i = 1; i <= qty; i++) {
      const el = document.getElementById(type + 'DoorPos' + i);
      const pos = normPos(el ? el.value : 'Front (Left Side)');
      const ke = document.getElementById(type + 'DoorKind' + i);
      const use = ke ? ke.value : (type === 'single' ? 'Front' : 'Back');
      doorsList.push(Object.assign(wallRect(pos, 4, 1.5, false), { pos, use, type: name, kind: type, index: i }));
    }
  });

  // Septic (or none)
  const septicOn = septicLoc !== 'None', wellOn = wellLoc !== 'None';
  let dHouseSeptic = num('distHouseSeptic');
  let dSepticRear = num('distSepticRear');
  const linkSeptic = (septicLoc === 'Back' && septicLastEdited === 'septicRear');
  if (linkSeptic) {
    dHouseSeptic = r2(V - dSepticRear - rawSD - ext.v1);
    document.getElementById('distHouseSeptic').value = dHouseSeptic;
  }
  const septic = septicOn ? { w: rawSW, h: rawSD } : null;
  if (!septicOn) { /* no septic system */ }
  else if (septicLoc === 'Back') { septic.v0 = ext.v1 + dHouseSeptic; septic.u0 = latOff(septicAlign, septicSide, rawSW); }
  else if (septicLoc === 'Front') { septic.v0 = ext.v0 - dHouseSeptic - rawSD; septic.u0 = latOff(septicAlign, septicSide, rawSW); }
  else if (septicLoc === 'Left') { septic.u0 = ext.u0 - dHouseSeptic - rawSW; septic.v0 = house.v0 + (house.h - rawSD) / 2; }
  else { septic.u0 = ext.u1 + dHouseSeptic; septic.v0 = house.v0 + (house.h - rawSD) / 2; }
  if (septicOn) { const gS = applyPL(septic, septicLoc, 'septic'); if (gS !== null) { dHouseSeptic = gS; document.getElementById('distHouseSeptic').value = gS; } }
  if (!linkSeptic && septicOn) {
    dSepticRear = r2(V - (septic.v0 + rawSD));
    document.getElementById('distSepticRear').value = dSepticRear;
  }

  // Well
  let dHouseWell = num('distHouseWell');
  let dWellRear = num('distWellRear');
  const linkWell = (wellLoc === 'Back' && wellLastEdited === 'wellRear');
  if (linkWell) {
    dHouseWell = r2(V - dWellRear - wellDiam - ext.v1);
    document.getElementById('distHouseWell').value = dHouseWell;
  }
  const well = wellOn ? { w: wellDiam, h: wellDiam } : null;
  if (!wellOn) { /* no well */ }
  else if (wellLoc === 'Back') { well.v0 = ext.v1 + dHouseWell; well.u0 = latOff(wellAlign, wellSide, wellDiam); }
  else if (wellLoc === 'Front') { well.v0 = ext.v0 - dHouseWell - wellDiam; well.u0 = latOff(wellAlign, wellSide, wellDiam); }
  else if (wellLoc === 'Left') { well.u0 = ext.u0 - dHouseWell - wellDiam; well.v0 = house.v0 + (house.h - wellDiam) / 2; }
  else { well.u0 = ext.u1 + dHouseWell; well.v0 = house.v0 + (house.h - wellDiam) / 2; }
  if (wellOn) { const gW = applyPL(well, wellLoc, 'well'); if (gW !== null) { dHouseWell = gW; document.getElementById('distHouseWell').value = gW; } }
  if (!linkWell && wellOn) {
    dWellRear = r2(V - (well.v0 + wellDiam));
    document.getElementById('distWellRear').value = dWellRear;
  }

  // Existing utilities: water meter and city sewer connection (placed like the well)
  const utilDefs = [['meter', 'Water Meter', '#1d4ed8', '#1e3a8a'], ['sewer', 'City Sewer', '#78716c', '#44403c']];
  const utils = [];
  utilDefs.forEach(([k, name, fill, stroke]) => {
    const loc = val(k + 'Loc');
    if (loc === 'None') return;
    const size = num(k + 'Size'), gap = num('distHouse' + k[0].toUpperCase() + k.slice(1)), align = val(k + 'Align'), sd = num(k + 'SideDist');
    const o = { key: k, name, fill, stroke, loc, size, gap, align, sd, w: size, h: size };
    if (loc === 'Back') { o.v0 = ext.v1 + gap; o.u0 = latOff(align, sd, size); }
    else if (loc === 'Front') { o.v0 = ext.v0 - gap - size; o.u0 = latOff(align, sd, size); }
    else if (loc === 'Left') { o.u0 = ext.u0 - gap - size; o.v0 = house.v0 + (house.h - size) / 2; }
    else { o.u0 = ext.u1 + gap; o.v0 = house.v0 + (house.h - size) / 2; }
    const g2 = applyPL(o, loc, k);
    if (g2 !== null) { o.gap = g2; document.getElementById('distHouse' + k[0].toUpperCase() + k.slice(1)).value = g2; }
    utils.push(o);
  });

  const houseDistLeft = r2(house.u0);
  const houseDistRight = r2(L - (house.u0 + house.w));
  const houseDistRear = r2(V - (house.v0 + house.h));
  const distWellSeptic = (!septic || !well) ? 0 : r2(Math.hypot((well.u0 + well.w / 2) - (septic.u0 + rawSW / 2), (well.v0 + well.h / 2) - (septic.v0 + rawSD / 2)));

  let drive = null;
  const driveDepthIn = num('driveD');
  if (drivePos !== 'None' && driveW > 0) {
    // Side driveways run to the back of the house; a front-center driveway runs to the front of the house / porch
    const len = driveDepthIn > 0 ? driveDepthIn : (drivePos === 'Front' ? ext.v0 - (stairsList.some(st => st.pos.startsWith('Front')) ? 3 : 0) : house.v0 + house.h);
    if (len > 0) {
      const plD = plIn('drive');
      if (drivePos === 'Left') {
        if (plD !== null) { const u0 = Math.min(Math.max(0, plD), L), u1 = Math.min(L, u0 + driveW); if (u1 > u0) drive = { u0, v0: 0, w: u1 - u0, h: len }; }
        else { const u1 = ext.u0 - 2, u0 = Math.max(0, u1 - driveW); if (u1 > u0) drive = { u0, v0: 0, w: u1 - u0, h: len }; }
      } else if (drivePos === 'Right') {
        if (plD !== null) { const u1 = Math.max(0, L - Math.max(0, plD)), u0 = Math.max(0, u1 - driveW); if (u1 > u0) drive = { u0, v0: 0, w: u1 - u0, h: len }; }
        else { const u0 = ext.u1 + 2, u1 = Math.min(L, u0 + driveW); if (u1 > u0) drive = { u0, v0: 0, w: u1 - u0, h: len }; }
      }
      else { const c0 = house.u0 + house.w / 2 - driveW / 2, u0 = Math.max(0, c0), u1 = Math.min(L, c0 + driveW); if (u1 > u0) drive = { u0, v0: 0, w: u1 - u0, h: len }; }
    }
  }

  /* ----- checks ----- */
  const warnings = [];
  if (drive && drive.w < driveW - 0.01) warnings.push(`Driveway narrowed to ${r2(drive.w)}' (not enough room for ${driveW}')`);
  const bodyNames = o => o === 'House' || o === 'Porch' || o.startsWith('Stairs') || o.includes('Door');
  const named = [['House', house], ['Porch', porch], ['Septic', septic], ['Well', well], ['Driveway', drive]];
  utils.forEach(o => named.push([o.name, o]));
  stairsList.forEach(s => named.push([`Stairs #${s.index}`, s]));
  doorsList.forEach(d => named.push([`${d.type} #${d.index}`, d]));
  const live = named.filter(o => o[1]);
  const hit = (a, b) => a.u0 < b.u0 + b.w - 0.01 && b.u0 < a.u0 + a.w - 0.01 && a.v0 < b.v0 + b.h - 0.01 && b.v0 < a.v0 + a.h - 0.01;
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    if ((live[i][0] === 'Driveway' && live[j][0].includes('Door')) || (live[j][0] === 'Driveway' && live[i][0].includes('Door'))) continue;
    const sameKind = (live[i][0].includes('Door') && live[j][0].includes('Door')) || (live[i][0].startsWith('Stairs') && live[j][0].startsWith('Stairs'));
    if (bodyNames(live[i][0]) && bodyNames(live[j][0]) && !sameKind) continue;
    if (hit(live[i][1], live[j][1])) warnings.push(`${live[i][0]} overlaps ${live[j][0]}`);
  }
  live.forEach(([n, r]) => {
    if (r.u0 < -0.01 || r.v0 < -0.01 || r.u0 + r.w > L + 0.01 || r.v0 + r.h > V + 0.01) { if (!n.includes('Door')) warnings.push(`${n} extends outside the lot`); }
    else if ((n === 'House' || n === 'Porch') && (r.u0 < rawSbL - 0.01 || r.u0 + r.w > L - rawSbRight + 0.01 || r.v0 < rawSbF - 0.01 || r.v0 + r.h > V - rawSbR + 0.01)) warnings.push(`${n} is outside the buildable area`);
  });

  /* ----- summary rows (screen box + contractor sheet table) ----- */
  const rows = [
    ['Street (front) edge', frontEdge],
    ['Lot size', `${pW}' x ${pD}' (${(pW * pD).toLocaleString()} sq ft)`],
    ['Front setback', `${rawSbF}'`],
    ['Rear setback', `${rawSbR}'`],
    [isVert ? 'Side setback (top)' : 'Left side setback', `${rawSbL}'`],
    [isVert ? 'Side setback (bottom)' : 'Right side setback', `${rawSbRight}'`],
    ['House size', `${rawHW}' x ${rawHD}'`],
    ['House position', posTxt(houseAlign, houseSide)],
    ['House to front property line', `${dHouseFront}'`],
    [`House to ${sideName('Left').toLowerCase()} property line`, `${houseDistLeft}'`],
    [`House to ${sideName('Right').toLowerCase()} property line`, `${houseDistRight}'`],
    ['House to rear property line', `${houseDistRear}'`],
    ['Porch', porch ? `${locTxt(porchPos)}, ${porchW}' x ${porchD}'` : 'None']
  ];
  if (!doorsList.length) rows.push(['Doors', 'None']);
  const doorLabel = p => {
    p = normPos(p);
    const m = p.match(/^Side (Left|Right) \((Top|Center|Bottom)\)$/);
    if (m) return `Side ${sideName(m[1])} (${m[2] === 'Center' ? 'Center' : (isVert ? (m[2] === 'Top' ? 'Left' : 'Right') : m[2])})`;
    return p.replace('(Left Side)', `(${sideName('Left')} side)`).replace('(Right Side)', `(${sideName('Right')} side)`);
  };
  stairsList.forEach(s => rows.push([`Stairs #${s.index}`, doorLabel(s.pos)]));
  doorsList.forEach(d => rows.push([`${d.type} #${d.index}`, `${d.use} door, ${doorLabel(d.pos)}`]));
  rows.push(
    ...(drive ? [
      ['Driveway', `${drivePos === 'Front' ? 'Front Center' : locTxt(drivePos)}, ${r2(drive.w)}' wide x ${r2(drive.h)}' deep`],
      [`Driveway to ${sideName('Left').toLowerCase()} property line`, `${r2(drive.u0)}'`],
      [`Driveway to ${sideName('Right').toLowerCase()} property line`, `${r2(L - drive.u0 - drive.w)}'`]
    ] : [['Driveway', 'None']]),
    ...(septic ? [
      ['Septic', `${locTxt(septicLoc)}, ${rawSW}' x ${rawSD}'`],
      ['House to septic', `${dHouseSeptic}'`],
      ['Septic to rear property line', `${dSepticRear}'`]
    ] : [['Septic', 'None']]),
    ...(well ? [
      ['Well', `${locTxt(wellLoc)}, dia. ${wellDiam}'`],
      ['House to well', `${dHouseWell}'`],
      ['Well to rear property line', `${dWellRear}'`]
    ] : [['Well', 'None']]),
    ...((septic && well) ? [['Well to septic (center to center)', `${distWellSeptic}'`]] : []),
    ...utilDefs.flatMap(([k, name]) => { const o = utils.find(u => u.key === k); return o ? [[`${name} (existing)`, `${locTxt(o.loc)}, ${o.size}'`], [`House to ${name.toLowerCase()}`, `${o.gap}'`]] : [[`${name} (existing)`, 'None']]; })
  );
  const warnHtml = warnings.length ? `<div style="color:#b91c1c;margin-top:8px;font-weight:600">&#9888; ${warnings.join('<br>&#9888; ')}</div>` : '';
  document.getElementById('metrics').innerHTML = `<strong>Key Measurements Summary:</strong><br>` +
    rows.map(([k, v]) => `&bull; ${k}: <strong>${v}</strong>`).join('<br>') + warnHtml;

  /* ----- header ----- */
  if (!exportMode) {
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title.toUpperCase(), CW / 2, 42);
  }

  /* ----- mapping from street coordinates to canvas ----- */
  const mapRect = r => {
    if (frontEdge === 'Bottom') return { x: originX + r.u0 * scale, y: originY + (pD - r.v0 - r.h) * scale, w: r.w * scale, h: r.h * scale };
    if (frontEdge === 'Top') return { x: originX + r.u0 * scale, y: originY + r.v0 * scale, w: r.w * scale, h: r.h * scale };
    if (frontEdge === 'Left') return { x: originX + r.v0 * scale, y: originY + r.u0 * scale, w: r.h * scale, h: r.w * scale };
    return { x: originX + (pW - r.v0 - r.h) * scale, y: originY + r.u0 * scale, w: r.h * scale, h: r.w * scale };
  };
  const mapPt = (u, v) => {
    if (frontEdge === 'Bottom') return { x: originX + u * scale, y: originY + (pD - v) * scale };
    if (frontEdge === 'Top') return { x: originX + u * scale, y: originY + v * scale };
    if (frontEdge === 'Left') return { x: originX + v * scale, y: originY + u * scale };
    return { x: originX + (pW - v) * scale, y: originY + u * scale };
  };
  // Name/size labels: inside the shape when they fit, otherwise beside it, always clear of other text
  const labelPlace = (r, text, font) => {
    ctx.font = font;
    const lines = text.split('\n');
    const tw = Math.max(...lines.map(t => ctx.measureText(t).width)), th = 12 * lines.length;
    const cands = [];
    if (tw + 6 <= r.w && th + 2 <= r.h) cands.push({ cx: r.x + r.w / 2, cy: r.y + r.h / 2, w: tw, h: th, rot: false, out: false });
    if (tw + 6 <= r.h && th + 2 <= r.w) cands.push({ cx: r.x + r.w / 2, cy: r.y + r.h / 2, w: th, h: tw, rot: true, out: false });
    [4, 18, 32, 46, 60].forEach(g => {
      cands.push({ cx: r.x + r.w + g + tw / 2, cy: r.y + r.h / 2, w: tw, h: th, out: true });
      cands.push({ cx: r.x - g - tw / 2, cy: r.y + r.h / 2, w: tw, h: th, out: true });
      cands.push({ cx: r.x + r.w / 2, cy: r.y - g - th / 2, w: tw, h: th, out: true });
      cands.push({ cx: r.x + r.w / 2, cy: r.y + r.h + g + th / 2, w: tw, h: th, out: true });
    });
    let best = cands[0], bestSc = Infinity;
    for (const c of cands) {
      const sc = boxScore({ x: c.cx - c.w / 2, y: c.cy - c.h / 2, w: c.w, h: c.h }) + (c.out ? 0.5 : 0);
      if (sc < bestSc) { bestSc = sc; best = c; if (sc <= 0.5) break; }
    }
    LBOX.push({ x: best.cx - best.w / 2, y: best.cy - best.h / 2, w: best.w, h: best.h });
    return best;
  };
  const labelPaint = (pl, text, font, color, outColor) => {
    ctx.save();
    ctx.translate(pl.cx, pl.cy);
    if (pl.rot) ctx.rotate(-Math.PI / 2);
    ctx.font = font;
    ctx.textAlign = 'center';
    const lines = text.split('\n');
    if (pl.out) { ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.fillStyle = outColor || '#1e293b'; } else ctx.fillStyle = color;
    lines.forEach((t, i) => {
      const y = 4 - (lines.length - 1) * 6 + i * 12;
      if (pl.out) ctx.strokeText(t, 0, y);
      ctx.fillText(t, 0, y);
    });
    ctx.restore();
  };
  const fitLabel = (r, text, font, color, outColor) => labelPaint(labelPlace(r, text, font), text, font, color, outColor);
  const box = (r, fill, stroke, lw) => {
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = lw;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  };

  /* ----- lot, buildable area, road ----- */
  ctx.fillStyle = '#f8fafc';
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3;
  ctx.fillRect(originX, originY, pW * scale, pD * scale);
  ctx.strokeRect(originX, originY, pW * scale, pD * scale);
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(originX + sbLeft * scale, originY + sbTop * scale, buildW * scale, buildD * scale);
  ctx.setLineDash([]);

  if (frontEdge === 'Bottom') drawRoad(ctx, originX, originY + pD * scale + 35, pW * scale, 24, 'FRONT PROPERTY ROAD (BOTTOM)');
  else if (frontEdge === 'Top') drawRoad(ctx, originX, originY - 65, pW * scale, 24, 'FRONT PROPERTY ROAD (TOP)');
  else if (frontEdge === 'Left') drawVerticalRoad(ctx, originX - 65, originY, 24, pD * scale, 'FRONT PROPERTY ROAD (LEFT)');
  else drawVerticalRoad(ctx, originX + pW * scale + 40, originY, 24, pD * scale, 'FRONT PROPERTY ROAD (RIGHT)');
  {
    const rt = `FRONT PROPERTY ROAD (${frontEdge.toUpperCase()})`;
    ctx.font = 'bold 11px sans-serif';
    const rtw = ctx.measureText(rt).width;
    const rx = frontEdge === 'Left' ? originX - 65 : originX + pW * scale + 40;
    const ry = frontEdge === 'Bottom' ? originY + pD * scale + 35 : originY - 65;
    if (frontEdge === 'Bottom' || frontEdge === 'Top') {
      SBOX.push({ x: originX, y: ry, w: pW * scale, h: 24 });
      LBOX.push({ x: originX + pW * scale / 2 - rtw / 2, y: ry + 5, w: rtw, h: 14 });
    } else {
      SBOX.push({ x: rx, y: originY, w: 24, h: pD * scale });
      LBOX.push({ x: rx + 5, y: originY + pD * scale / 2 - rtw / 2, w: 14, h: rtw });
    }
  }

  /* ----- objects (every name and size gets its own clear spot) ----- */
  if (drive) { const r = mapRect(drive); box(r, '#e5e7eb', '#9ca3af', 1.5); fitLabel(r, `DRIVEWAY ${r2(drive.w)}' x ${r2(drive.h)}'`, 'bold 10px sans-serif', '#374151'); }
  if (porch) { const r = mapRect(porch); box(r, '#c4b5fd', '#7c3aed', 1.5); fitLabel(r, `PORCH ${porchW}' x ${porchD}'`, 'bold 10px sans-serif', '#2e1065'); SBOX.push(r); }

  const Rh = mapRect(house);
  box(Rh, '#3b82f6', '#1d4ed8', 2);
  ctx.font = 'bold 13px sans-serif';
  const hLine2 = `${rawHW}' x ${rawHD}'`;
  const hwMax = Math.max(ctx.measureText('HOUSE').width, ctx.measureText(hLine2).width);
  if (hwMax + 8 <= Rh.w && Rh.h >= 36) {
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.fillText('HOUSE', Rh.x + Rh.w / 2, Rh.y + Rh.h / 2 - 2);
    ctx.fillText(hLine2, Rh.x + Rh.w / 2, Rh.y + Rh.h / 2 + 14);
    LBOX.push({ x: Rh.x + Rh.w / 2 - hwMax / 2, y: Rh.y + Rh.h / 2 - 14, w: hwMax, h: 32 });
  } else fitLabel(Rh, `HOUSE ${hLine2}`, 'bold 12px sans-serif', '#000000');
  SBOX.push(Rh);

  stairsList.forEach(s2 => { const r = mapRect(s2); box(r, '#fb7185', '#be123c', 1.5); fitLabel(r, `STAIRS #${s2.index} (4' x 3')`, 'bold 9px sans-serif', '#ffffff'); SBOX.push(r); });
  doorsList.forEach(d => {
    const r = mapRect(d), sld = d.kind === 'sliding';
    box(r, sld ? '#ec4899' : '#0ea5e9', sld ? '#831843' : '#0369a1', 1.5);
    fitLabel(r, `${d.use.toUpperCase()} ${sld ? 'SLIDING' : 'SINGLE'} DOOR #${d.index} (4')`, 'bold 9px sans-serif', '#ffffff', sld ? '#9d174d' : '#0369a1');
    SBOX.push(r);
  });

  if (septic) {
    const Rs = mapRect(septic);
    box(Rs, '#f59e0b', '#d97706', 2);
    fitLabel(Rs, `SEPTIC\n${rawSW}' x ${rawSD}'`, 'bold 10px sans-serif', '#78350f');
    SBOX.push(Rs);
  }

  // Well and existing utilities: names are placed now (so dimension labels keep clear), painted last
  const wc = well ? mapPt(well.u0 + well.w / 2, well.v0 + well.h / 2) : { x: 0, y: 0 };
  const wrPx = Math.max(7, (wellDiam / 2) * scale);
  let wellPaint = null;
  if (well) {
    const wr = { x: wc.x - wrPx, y: wc.y - wrPx, w: wrPx * 2, h: wrPx * 2 };
    const txt = `WELL (dia. ${wellDiam}')`;
    wellPaint = { pl: labelPlace(wr, txt, 'bold 11px sans-serif'), txt };
    SBOX.push(wr);
  }
  const utilPaint = utils.map(o => {
    const r0 = mapRect(o);
    const sz = Math.max(9, r0.w, r0.h);
    const r = { x: r0.x + r0.w / 2 - sz / 2, y: r0.y + r0.h / 2 - sz / 2, w: sz, h: sz };
    const txt = `${o.name.toUpperCase()} (EXISTING) ${o.size}'`;
    const up = { o, r, txt, pl: labelPlace(r, txt, 'bold 10px sans-serif') };
    SBOX.push(r);
    return up;
  });

  /* ----- dimension lines ----- */
  const bodyRects = [house, porch, septic, well, ...utils].filter(Boolean).map(mapRect);
  const shapesBottom = Math.max(...bodyRects.map(r => r.y + r.h));
  let stack = 0;
  const dimLocal = (a, b, label, opts) => {
    const A = mapPt(a[0], a[1]), B = mapPt(b[0], b[1]);
    ctx.font = '10px sans-serif';
    const tw = ctx.measureText(label).width + 14;
    if (Math.abs(A.y - B.y) < 1 && Math.abs(A.x - B.x) < tw && !(opts && (opts.dash || opts.noExt))) {
      drawDimWithExt(ctx, A.x, A.y, B.x, B.y, shapesBottom + 16 + 20 * stack++, label, originX, originX + pW * scale);
    } else drawDimensionArrow(ctx, A.x, A.y, B.x, B.y, label, opts || {});
  };
  const dash = Object.assign({ dash: true, color: '#2563eb', textColor: '#1e3a8a', font: 'bold 10px sans-serif' });

  // Setbacks
  const midV = V * 0.5, sbU = L * (isVert ? 0.8 : 0.2);
  dimLocal([0, midV], [rawSbL, midV], isVert ? `SIDE SETBACK (${rawSbL}')` : `LEFT SETBACK (${rawSbL}')`, { side: -1, noExt: true });
  dimLocal([L, midV], [L - rawSbRight, midV], isVert ? `SIDE SETBACK (${rawSbRight}')` : `RIGHT SETBACK (${rawSbRight}')`, { side: -1, noExt: true });
  dimLocal([sbU, 0], [sbU, rawSbF], `FRONT SETBACK (${rawSbF}')`, { side: isVert ? -1 : 1, noExt: true });
  dimLocal([sbU, V], [sbU, V - rawSbR], `REAR SETBACK (${rawSbR}')`, { side: isVert ? -1 : 1, noExt: true });

  // House to property lines (dashed blue)
  const uF = house.u0 + house.w * 0.12;
  dimLocal([uF, 0], [uF, house.v0], `${dHouseFront}' to Front PL`, Object.assign({ side: drive ? -1 : 1 }, dash));
  const uR = house.u0 + house.w * 0.95;
  dimLocal([uR, house.v0 + house.h], [uR, V], `${houseDistRear}' to Rear PL`, Object.assign({ side: 1 }, dash));
  let vS = house.v0 + house.h * 0.5;
  if (isVert) {
    const cx = originX + pW * scale / 2;
    const f = [0.5, 0.15, 0.85].find(f => Math.abs(mapPt(0, house.v0 + house.h * f).x - cx) >= 40);
    if (f !== undefined) vS = house.v0 + house.h * f;
  }
  dimLocal([0, vS], [house.u0, vS], `${houseDistLeft}' to ${sideName('Left')} PL`, Object.assign({ side: -1 }, dash));
  dimLocal([house.u0 + house.w, vS], [L, vS], `${houseDistRight}' to ${sideName('Right')} PL`, Object.assign({ side: -1 }, dash));

  if (septic) {
  // House to septic / septic to rear
  const gapS = `${dHouseSeptic}' (House to Septic)`;
  const sUo = midOverlap(ext.u0, ext.u1, septic.u0, septic.u0 + rawSW);
  if (septicLoc === 'Back') dimLocal([sUo, ext.v1], [sUo, septic.v0], gapS);
  else if (septicLoc === 'Front') dimLocal([sUo, septic.v0 + rawSD], [sUo, ext.v0], gapS);
  else {
    const v = midOverlap(house.v0, house.v0 + house.h, septic.v0, septic.v0 + rawSD);
    if (septicLoc === 'Left') dimLocal([septic.u0 + rawSW, v], [ext.u0, v], gapS);
    else dimLocal([ext.u1, v], [septic.u0, v], gapS);
  }
  const uSR = septic.u0 + rawSW * 0.75;
  if (septicLoc === 'Front') dimLocal([uSR, 0], [uSR, septic.v0], `${r2(septic.v0)}' (Septic to Front PL)`);
  else dimLocal([uSR, septic.v0 + rawSD], [uSR, V], `${dSepticRear}' (Septic to Rear PL)`);
  }

  if (well) {
  // House to well / well to rear
  const gapW = `${dHouseWell}' (House to Well)`;
  const wUo = midOverlap(ext.u0, ext.u1, well.u0, well.u0 + wellDiam);
  const wMidU = well.u0 + wellDiam / 2;
  if (wellLoc === 'Back') dimLocal([wUo, ext.v1], [wUo, well.v0], gapW);
  else if (wellLoc === 'Front') dimLocal([wUo, well.v0 + wellDiam], [wUo, ext.v0], gapW);
  else {
    const v = well.v0 + wellDiam / 2;
    if (wellLoc === 'Left') dimLocal([well.u0 + wellDiam, v], [ext.u0, v], gapW);
    else dimLocal([ext.u1, v], [well.u0, v], gapW);
  }
  if (wellLoc === 'Front') dimLocal([wMidU, 0], [wMidU, well.v0], `${r2(well.v0)}' (Well to Front PL)`);
  else dimLocal([wMidU, well.v0 + wellDiam], [wMidU, V], `${dWellRear}' (Well to Rear PL)`);
  }

  // Septic / well distance from the property side line (only when placed Left or Right)
  const sideDist = (r, align, d) => {
    if (align === 'Center' || d <= 0) return;
    const v = r.v0 + r.h * 0.5;
    if (align === 'Left') dimLocal([0, v], [r.u0, v], `${d}' to ${sideName('Left')} PL`);
    else dimLocal([r.u0 + r.w, v], [L, v], `${d}' to ${sideName('Right')} PL`);
  };
  if (septic && (septicLoc === 'Front' || septicLoc === 'Back')) sideDist(septic, septicAlign, septicSide);
  if (well && (wellLoc === 'Front' || wellLoc === 'Back')) sideDist(well, wellAlign, wellSide);
  [['septic', septic, septicLoc], ['well', well, wellLoc]].forEach(([k, o, loc]) => { if (o && (loc === 'Left' || loc === 'Right') && plIn(k) !== null) sideDist(o, loc, plIn(k)); });
  utils.forEach(o => {
    const uc = o.u0 + o.w / 2, nm = o.name;
    const uo = midOverlap(ext.u0, ext.u1, o.u0, o.u0 + o.w);
    const gl = `${o.gap}' (House to ${nm})`;
    if (o.loc === 'Back') dimLocal([uo, ext.v1], [uo, o.v0], gl);
    else if (o.loc === 'Front') dimLocal([uo, o.v0 + o.h], [uo, ext.v0], gl);
    else {
      const v = o.v0 + o.h / 2;
      if (o.loc === 'Left') dimLocal([o.u0 + o.w, v], [ext.u0, v], gl); else dimLocal([ext.u1, v], [o.u0, v], gl);
    }
    if (o.loc === 'Front') dimLocal([uc, 0], [uc, o.v0], `${r2(o.v0)}' (${nm} to Front PL)`);
    else dimLocal([uc, o.v0 + o.h], [uc, V], `${r2(V - (o.v0 + o.h))}' (${nm} to Rear PL)`);
    if (o.loc === 'Front' || o.loc === 'Back') sideDist(o, o.align, o.sd);
    if ((o.loc === 'Left' || o.loc === 'Right') && plIn(o.key) !== null) sideDist(o, o.loc, plIn(o.key));
  });
  if (drive) {
    const green = { dash: true, color: '#059669', textColor: '#065f46', font: 'bold 10px sans-serif' };
    dimLocal([drive.u0, drive.h * 0.5], [drive.u0 + drive.w, drive.h * 0.5], `${r2(drive.w)}' wide`);
    dimLocal([drive.u0 + drive.w, 0], [drive.u0 + drive.w, drive.h], `${r2(drive.h)}' (Driveway Depth)`, { side: 1 });
    // distances from the driveway to BOTH side property lines (drawn in front of the house)
    const dL = r2(drive.u0), dR = r2(L - (drive.u0 + drive.w));
    const base = Math.min(drive.h, ext.v0 > 6 ? ext.v0 : drive.h);
    const vP = base * 0.25;
    const gopt = Object.assign({ side: isVert ? 1 : -1 }, green);
    if (dL > 0.5) dimLocal([0, vP], [drive.u0, vP], `${dL}' Driveway to ${sideName('Left')} PL`, gopt);
    if (dR > 0.5) dimLocal([drive.u0 + drive.w, vP], [L, vP], `${dR}' Driveway to ${sideName('Right')} PL`, gopt);
  }

  if (well) {
    ctx.beginPath();
    ctx.arc(wc.x, wc.y, wrPx, 0, 2 * Math.PI);
    ctx.fillStyle = '#06b6d4';
    ctx.fill();
    ctx.strokeStyle = '#0891b2';
    ctx.lineWidth = 2;
    ctx.stroke();
    labelPaint(wellPaint.pl, wellPaint.txt, 'bold 11px sans-serif', '#0e7490', '#0e7490');
  }
  utilPaint.forEach(({ o, r, txt, pl }) => {
    box(r, o.fill, o.stroke, 1.5);
    labelPaint(pl, txt, 'bold 10px sans-serif', o.stroke, o.stroke);
  });

  // Overall lot dimensions
  const dimFont = 'bold 12px sans-serif';
  drawDimensionArrow(ctx, originX, originY - 14, originX + pW * scale, originY - 14, `${pW}' LOT WIDTH`, { font: dimFont, fixed: true });
  const dX = originX - (frontEdge === 'Left' ? 30 : 54);
  drawDimensionArrow(ctx, dX, originY, dX, originY + pD * scale, '');
  ctx.save();
  ctx.translate(dX, originY + pD * scale * (isVert ? 0.4 : 0.5));
  ctx.rotate(-Math.PI / 2);
  ctx.font = dimFont;
  const depthTxt = `${pD}' LOT DEPTH`;
  const depthW = ctx.measureText(depthTxt).width;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-depthW / 2 - 6, -9, depthW + 12, 18);
  ctx.fillStyle = '#0f172a';
  ctx.textAlign = 'center';
  ctx.fillText(depthTxt, 0, 4);
  ctx.restore();

  /* ----- contractor sheet extras ----- */
  let neededHeight = 0;
  if (exportMode) {
    const area = Math.round(pW * pD);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, CW - 20, CH - 20);
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SITE PLAN', 30, 46);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#475569';
    ctx.textAlign = 'right';
    ctx.fillText('Proposed house, septic system & well layout', CW - 30, 40);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(10, 62); ctx.lineTo(CW - 10, 62); ctx.moveTo(10, 106); ctx.lineTo(CW - 10, 106); ctx.stroke();
    const cells = [
      ['PROPERTY ADDRESS', title.toUpperCase(), 10, 400], ['LOT WIDTH', `${pW}'`, 400, 520], ['LOT DEPTH', `${pD}'`, 520, 640],
      ['LOT AREA', `${area.toLocaleString()} SQ FT (${(area / 43560).toFixed(2)} AC)`, 640, 830], ['DATE', new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }), 830, CW - 10]
    ];
    cells.forEach(([lab, v, x0, x1], i) => {
      if (i > 0) { ctx.beginPath(); ctx.moveTo(x0, 62); ctx.lineTo(x0, 106); ctx.stroke(); }
      ctx.fillStyle = '#64748b'; ctx.font = 'bold 9px sans-serif'; ctx.fillText(lab, x0 + 10, 76);
      let fs = 17;
      do { ctx.font = `bold ${fs}px sans-serif`; fs--; } while (ctx.measureText(v).width > x1 - x0 - 20 && fs > 8);
      ctx.fillStyle = '#0f172a'; ctx.fillText(v, x0 + 10, 98);
    });

    const tableY = originY + pD * scale + 85;
    const half = Math.ceil(rows.length / 2);
    const tableH = 50 + half * 18 + 14;
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#cbd5e1';
    ctx.fillRect(30, tableY, CW - 60, tableH);
    ctx.strokeRect(30, tableY, CW - 60, tableH);
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SETBACKS, DIMENSIONS & EQUIPMENT SCHEDULE', 48, tableY + 28);
    rows.forEach(([k, v], i) => {
      const col = i < half ? 0 : 1, row = i < half ? i : i - half;
      const x = 48 + col * 440, y = tableY + 52 + row * 18;
      ctx.textAlign = 'left'; ctx.fillStyle = '#475569'; ctx.font = '11px sans-serif'; ctx.fillText(k, x, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(v, x + 410, y);
      ctx.strokeStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(x, y + 5); ctx.lineTo(x + 410, y + 5); ctx.stroke();
    });

    let ly = tableY + tableH + 28;
    if (warnings.length) {
      ctx.textAlign = 'left'; ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('CHECK: ' + warnings.join('; '), 30, ly);
      ly += 24;
    }
    const legend = [['#3b82f6', 'House'], ['#c4b5fd', 'Porch'], ['#fb7185', 'Stairs'], ['#0ea5e9', 'Single door'], ['#ec4899', 'Sliding door'], ['#f59e0b', 'Septic'], ['#06b6d4', 'Well'], ['#e5e7eb', 'Driveway'], ['#1d4ed8', 'Water meter'], ['#78716c', 'City sewer']];
    let lx = 30;
    ctx.font = '11px sans-serif';
    legend.forEach(([c, t]) => {
      if (lx + 17 + ctx.measureText(t).width + 18 > CW - 30) { lx = 30; ly += 20; }
      ctx.fillStyle = c; ctx.fillRect(lx, ly - 9, 12, 12);
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 0.5; ctx.strokeRect(lx, ly - 9, 12, 12);
      ctx.fillStyle = '#1e293b'; ctx.textAlign = 'left'; ctx.fillText(t, lx + 17, ly + 1);
      lx += 17 + ctx.measureText(t).width + 18;
    });
    if (lx + 130 > CW - 30) { lx = 30; ly += 20; }
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(lx, ly - 3); ctx.lineTo(lx + 24, ly - 3); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#1e293b'; ctx.fillText('Buildable line', lx + 30, ly + 1);
    ly += 30;
    const barFt = [200, 100, 50, 25, 20, 10, 5].find(f => f * scale <= 170) || 5;
    const bl = barFt * scale;
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(30, ly, bl / 2, 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(30 + bl / 2, ly, bl / 2, 6);
    ctx.strokeRect(30, ly, bl, 6);
    ctx.fillStyle = '#0f172a'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('0', 30, ly + 18); ctx.fillText(`${barFt / 2}'`, 30 + bl / 2, ly + 18); ctx.fillText(`${barFt}'`, 30 + bl, ly + 18);
    ctx.textAlign = 'left'; ctx.fillStyle = '#64748b'; ctx.font = 'italic 10px sans-serif';
    ctx.fillText('Scale bar (feet). Drawn to scale for contractor reference. Not a survey; verify all dimensions on site.', 30 + bl + 16, ly + 7);
    neededHeight = ly + 40;
  }
  return { neededHeight, scale, rows, warnings };
}

function saveContractorSheet() {
  // First pass measures how tall the sheet must be, second pass draws it sharply at 2x
  const probe = document.createElement('canvas');
  probe.width = 950; probe.height = 1600;
  const info = drawSitePlan(probe, 1, true);
  if (!info) { alert('Enter a lot width and lot depth first.'); return; }
  const H = Math.ceil(Math.max(900, info.neededHeight));
  const out = document.createElement('canvas');
  out.width = 950 * 2; out.height = H * 2;
  drawSitePlan(out, 2, true);
  const link = document.createElement('a');
  const t = document.getElementById('propName').value || 'site_plan';
  link.download = `${t.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_site_plan.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  drawSitePlan(); // restore the on-screen summary
}

window.onload = () => {
  loadState();
  updateAlignLabels();
  updateStairsQtyUI(true);
  updateDoorQtyUI('single', true);
  updateDoorQtyUI('sliding', true);
  updateAlignLabels();
  saveAndDraw();
};
</script>
